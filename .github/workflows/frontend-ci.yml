name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # ── static checks ──────────────────────────────────────────────
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ── unit tests ─────────────────────────────────────────────────
      - name: Unit tests
        run: npm test

      # ── build (required for e2e + lighthouse) ──────────────────────
      - name: Build
        run: npm run build

      - name: Build widget
        run: npm run build:widget

      # ── bundle size check ──────────────────────────────────────────
      - name: Bundle size check
        run: |
          BUNDLE_KB=$(du -sk .next/static | awk '{print $1}')
          echo "Bundle size: ${BUNDLE_KB} KB"
          if [ "$BUNDLE_KB" -gt 512 ]; then
            echo "::error::Bundle size ${BUNDLE_KB} KB exceeds 512 KB limit"
            exit 1
          fi

      # ── Playwright e2e ─────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      # ── Lighthouse CI ──────────────────────────────────────────────
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert Lighthouse thresholds
        run: |
          REPORT=$(ls -t .lighthouseci/*.json 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then echo "No Lighthouse report found"; exit 1; fi
          LCP=$(python3 -c "import json,sys; d=json.load(open('$REPORT')); print(d['audits']['largest-contentful-paint']['numericValue'])")
          CLS=$(python3 -c "import json,sys; d=json.load(open('$REPORT')); print(d['audits']['cumulative-layout-shift']['numericValue'])")
          echo "LCP=${LCP}ms  CLS=${CLS}"
          python3 -c "
          lcp=float('$LCP'); cls=float('$CLS')
          if lcp > 2500: raise SystemExit(f'LCP {lcp}ms > 2500ms threshold')
          if cls > 0.1:  raise SystemExit(f'CLS {cls} > 0.1 threshold')
          print('Lighthouse thresholds passed')
          "
